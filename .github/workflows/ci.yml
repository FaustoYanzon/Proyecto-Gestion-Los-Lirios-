name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
        # No PostgreSQL service needed here: the suite runs against an
        # in-memory SQLite database (see backend/tests/conftest.py) and
        # never touches a real database.

  frontend-build:
    name: Frontend build (Next.js, type-checks on build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        # `next build` type-checks the whole project by default (no
        # ignoreBuildErrors in next.config) -- a separate `tsc --noEmit`
        # step would be redundant.
        #
        # `npm run lint` is intentionally NOT part of this gate yet: it
        # currently fails with pre-existing errors (documented in
        # docs/sistema/Bugs Conocidos.md, "Lint del frontend no pasa"),
        # unrelated to any specific change. Wire it in once that backlog
        # is cleared, so a red check always means something real broke.
