name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
        # `-m pytest` (not the bare `pytest` script) so the backend/ dir
        # (cwd) is prepended to sys.path and `import app...` resolves --
        # otherwise pytest's default rootdir insertion only adds tests/
        # itself, giving "ModuleNotFoundError: No module named 'app'"
        # (reproduced and confirmed via `docker run python:3.12-slim`
        # before this fix). No PostgreSQL service needed: the suite runs
        # against an in-memory SQLite database (backend/tests/conftest.py)
        # and never touches a real database.

  frontend-build:
    name: Frontend build (Next.js, type-checks on build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
        # 18 pre-existing errors (all React Compiler's "setState in effect"/
        # "impure render"/"static-components" rules) cleaned up 2026-09-22 --
        # see docs/sistema/Bugs Conocidos.md, entry now moved to Resueltos.
      - run: npm run build
        # `next build` type-checks the whole project by default (no
        # ignoreBuildErrors in next.config) -- a separate `tsc --noEmit`
        # step would be redundant.
